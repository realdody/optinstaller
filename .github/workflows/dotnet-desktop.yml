name: Desktop CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore "Optinstaller.sln"

      - name: Build solution
        run: dotnet build "Optinstaller.sln" -c Release --no-restore

      - name: Publish desktop app
        run: dotnet publish "Optinstaller\OptiManager.csproj" -c Release --no-build --output "${{ github.workspace }}\artifacts\publish"

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: OptiManager-windows
          path: ${{ github.workspace }}\artifacts\publish
          if-no-files-found: error
